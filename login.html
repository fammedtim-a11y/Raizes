<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raízes Kids | Acesso</title>
    <link rel="stylesheet" href="styles.css?v=20261001-family-free" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card">
        <img class="auth-logo" src="assets/logo-raizes-kids.png" alt="Raízes Kids" />
        <div class="auth-tabs">
          <button class="manage-tab active" type="button" data-auth-tab="login">Entrar</button>
          <button class="manage-tab" type="button" data-auth-tab="register">Cadastrar</button>
          <button class="manage-tab" type="button" data-auth-tab="reset">Redefinir senha</button>
        </div>

        <form id="loginForm" class="auth-form active" data-auth-panel="login">
          <h1>Entrar no sistema</h1>
          <label>
            <span>Usuário/CPF</span>
            <input name="username" inputmode="numeric" autocomplete="username" required />
          </label>
          <label>
            <span>Senha</span>
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="icon-button primary" type="submit">Entrar</button>
        </form>

        <form id="registerForm" class="auth-form" data-auth-panel="register">
          <h1>Criar cadastro</h1>
          <p>Comece gratuitamente com todos os Cultos em Família. Você poderá liberar lições e trilhas quando quiser.</p>
          <label><span>Nome completo</span><input name="name" required /></label>
          <label><span>CPF</span><input name="cpf" inputmode="numeric" required /></label>
          <label><span>Email</span><input name="email" type="email" required /></label>
          <label><span>Telefone</span><input name="phone" inputmode="tel" required /></label>
          <label><span>Endereço (opcional)</span><input name="address" /></label>
          <label><span>Igreja que pertence (opcional)</span><input name="church" /></label>
          <label><span>Cidade da Igreja (opcional)</span><input name="churchCity" /></label>
          <label><span>Como pretende usar o Raízes Kids?</span><select name="intendedUse"><option value="family">Com minha família</option><option value="leader">Como líder/professor</option><option value="coordinator">Coordenando uma equipe</option><option value="both">Na família e na igreja</option></select></label>
          <label><span>Faixa etária de maior interesse</span><select name="ageInterest"><option value="">Todas</option><option>0 a 2 anos</option><option>3 a 4 anos</option><option>5 a 6 anos</option><option>7 a 10 anos</option><option>11 a 12 anos</option></select></label>
          <label><span>Como conheceu o Raízes Kids?</span><select name="signupSource"><option value="instagram">Instagram</option><option value="indication">Indicação</option><option value="church">Igreja</option><option value="search">Pesquisa na internet</option><option value="other">Outro</option></select></label>
          <label>
            <span>Plano desejado</span>
            <select name="desiredPlan" required>
              <option value="family">Família Grátis - Cultos em Família</option>
              <option value="monthly">Plano Líder - R$ 19,90/mês</option>
              <option value="premium">Plano Premium - R$ 349,90 por 12 meses</option>
            </select>
          </label>
          <label><span>Senha de 6 dígitos</span><input name="password" type="password" inputmode="numeric" minlength="6" maxlength="6" required /></label>
          <label><span>Confirmar senha</span><input name="confirmPassword" type="password" inputmode="numeric" minlength="6" maxlength="6" required /></label>
          <label class="inline-check"><input name="consentWhatsapp" type="checkbox" /> Autorizo o Raízes Kids a enviar orientações sobre meu cadastro, pagamento e acesso pelo WhatsApp. Posso cancelar quando quiser.</label>
          <label class="inline-check"><input name="emailOptIn" type="checkbox" /> Quero receber novidades, novos conteúdos e orientações por email.</label>
          <button class="icon-button primary" type="submit">Criar meu acesso</button>
        </form>

        <form id="resetForm" class="auth-form" data-auth-panel="reset">
          <h1>Redefinir senha</h1>
          <p>Confirme seus dados de cadastro para criar uma nova senha imediatamente.</p>
          <label><span>CPF</span><input name="cpf" inputmode="numeric" required /></label>
          <label><span>Email cadastrado</span><input name="email" type="email" required /></label>
          <label><span>Telefone cadastrado</span><input name="phone" inputmode="tel" required /></label>
          <label><span>Nova senha de 6 dígitos</span><input name="password" type="password" inputmode="numeric" minlength="6" maxlength="6" required /></label>
          <label><span>Confirmar nova senha</span><input name="confirmPassword" type="password" inputmode="numeric" minlength="6" maxlength="6" required /></label>
          <button class="icon-button accent" type="submit">Redefinir senha</button>
        </form>

        <p id="authMessage" class="auth-message" role="status"></p>
        <a class="auth-back" href="index.html">Voltar para o site</a>
      </section>
    </main>
    <script src="auth.js?v=20261001-family-free"></script>
  </body>
</html>
